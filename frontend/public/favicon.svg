<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#03060d"/>
    </linearGradient>

    <!-- Neon Cyan-Blue Gradient for Border and Text -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Subtle Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Square Container -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="url(#bgGrad)" stroke="url(#neonGrad)" stroke-width="16" filter="url(#glow)"/>

  <!-- Stylized "TM" Text -->
  <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="900" font-size="220" fill="url(#neonGrad)" letter-spacing="4">
    TM
  </text>
</svg>
